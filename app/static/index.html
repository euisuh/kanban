<!doctype html>
<html lang="en" data-theme="light" data-density="comfortable">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kanban</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=Schibsted+Grotesk:wght@600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="bg-tint"></div>
    <div id="bg-layer" data-on="0"></div>

    <div class="app">
      <!-- Top bar -->
      <header class="topbar">
        <div class="brand">
          <span class="mark"><i class="dot"></i>Kanban</span>
        </div>

        <div class="quickadd" id="quickadd-wrap">
          <form id="card-form" class="qa-input">
            <svg class="qa-plus" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <path d="M10 4v12M4 10h12"/>
            </svg>
            <input
              id="quick-add"
              type="text"
              placeholder="Add a task…  e.g.  Ship login fix @auth p1 | check token expiry"
              autocomplete="off"
            />
            <span class="qa-enter">⏎ Backlog</span>
          </form>
          <div class="qa-preview hidden" id="qa-preview" aria-live="polite"></div>
        </div>

        <button class="icon-btn" id="bg-toggle" type="button" title="Board background" aria-label="Board background">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="14" height="12" rx="2"/>
            <circle cx="7.5" cy="8.5" r="1.5"/>
            <path d="m4 14 4-3.5 4 3 3-2.5 3 2.5"/>
          </svg>
        </button>
        <button class="icon-btn" id="theme-toggle" type="button" title="Toggle theme" aria-label="Toggle theme">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="10" cy="10" r="4"/>
            <path d="M10 2v2M10 16v2M2 10h2M16 10h2M4.22 4.22l1.42 1.42M14.36 14.36l1.42 1.42M4.22 15.78l1.42-1.42M14.36 5.64l1.42-1.42"/>
          </svg>
        </button>
      </header>

      <!-- Filter rail -->
      <div class="filters" id="filter-bar" role="toolbar" aria-label="Board filters">
        <label class="search">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/>
          </svg>
          <input id="search-input" type="search" placeholder="Search cards…" />
        </label>
        <div class="divider"></div>
        <div class="filter-group" id="proj-filter-group">
          <span class="lbl">Project</span>
        </div>
        <div class="divider" id="proj-divider"></div>
        <div class="filter-group" id="pri-filter-group">
          <span class="lbl">Priority</span>
          <!-- chips rendered by JS -->
        </div>
        <button class="clear-filter" id="clear-filters" type="button" hidden>Clear</button>
      </div>

      <!-- Board -->
      <div class="board-scroll">
        <div class="board" id="board" aria-label="Kanban board"></div>
      </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

    <!-- Card modal -->
    <div class="overlay" id="modal-overlay" hidden role="dialog" aria-modal="true" aria-label="Edit card">
      <div class="sheet" id="modal-sheet">
        <div class="sheet-head">
          <span class="ttl">Edit card</span>
          <span class="status-readonly" id="modal-status-badge"></span>
          <button class="icon-btn" id="modal-close" type="button" style="width:32px;height:32px" aria-label="Close">
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <path d="m5 5 10 10M15 5 5 15"/>
            </svg>
          </button>
        </div>
        <div class="sheet-body">
          <div class="field">
            <input class="modal-title-input" type="text" id="modal-title" placeholder="Card title" />
          </div>
          <div class="field">
            <label for="modal-notes">Note</label>
            <textarea id="modal-notes" placeholder="Add more detail…"></textarea>
          </div>
          <div class="row2">
            <div class="field">
              <label>Project</label>
              <div class="choose" id="modal-proj-choose"></div>
            </div>
            <div class="field">
              <label>Priority</label>
              <div class="choose" id="modal-pri-choose"></div>
            </div>
          </div>
          <div class="hint">Status is set by dragging the card between columns.</div>
        </div>
        <div class="sheet-foot">
          <button class="btn danger" id="modal-delete" type="button">
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 6h12M8 6V4h4v2M6 6l.7 10a1 1 0 0 0 1 1h4.6a1 1 0 0 0 1-1L14 6"/>
            </svg>
            Delete
          </button>
          <span class="grow"></span>
          <button class="btn ghost" id="modal-cancel" type="button">Cancel</button>
          <button class="btn primary" id="modal-save" type="button">Save</button>
        </div>
      </div>
    </div>

    <!-- Background panel -->
    <div class="overlay" id="bg-overlay" hidden role="dialog" aria-modal="true" aria-label="Board background">
      <div class="sheet narrow" id="bg-sheet">
        <div class="sheet-head">
          <svg style="width:18px;height:18px;color:var(--accent)" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="14" height="12" rx="2"/>
            <circle cx="7.5" cy="8.5" r="1.5"/>
            <path d="m4 14 4-3.5 4 3 3-2.5 3 2.5"/>
          </svg>
          <span class="ttl">Board background</span>
          <span class="grow" style="flex:1"></span>
          <button class="icon-btn" id="bg-close" type="button" style="width:32px;height:32px" aria-label="Close">
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <path d="m5 5 10 10M15 5 5 15"/>
            </svg>
          </button>
        </div>
        <div class="sheet-body" id="bg-body">
          <!-- rendered by JS -->
        </div>
        <div class="sheet-foot">
          <span class="grow" style="flex:1"></span>
          <button class="btn ghost" id="bg-cancel" type="button">Cancel</button>
          <button class="btn primary" id="bg-apply" type="button">Apply</button>
        </div>
        <input class="sr-file" type="file" id="bg-file-input" accept="image/jpeg,image/png,image/webp,image/gif" />
      </div>
    </div>

    <!-- Templates -->
    <template id="column-template">
      <section class="column" data-col-id="">
        <header class="col-head">
          <i class="tag"></i>
          <span class="name"></span>
          <span class="grow" style="flex:1"></span>
          <span class="count"></span>
        </header>
        <div class="col-cards"></div>
      </section>
    </template>

    <template id="card-template">
      <div class="card">
        <button class="card-grip" type="button" aria-label="Drag to move">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="8" cy="5" r="1.3"/><circle cx="8" cy="10" r="1.3"/><circle cx="8" cy="15" r="1.3"/>
            <circle cx="12" cy="5" r="1.3"/><circle cx="12" cy="10" r="1.3"/><circle cx="12" cy="15" r="1.3"/>
          </svg>
        </button>
        <div class="card-main">
          <div class="card-top">
            <div class="title"></div>
            <span class="status-pill"><i class="sdot"></i><span class="sname"></span></span>
          </div>
          <div class="desc"></div>
          <div class="card-foot">
            <span class="proj-chip"><i class="pj"></i><span class="pname"></span></span>
            <span class="grow" style="flex:1"></span>
            <span class="pri"><i class="pdot"></i><span class="pshort"></span></span>
          </div>
        </div>
      </div>
    </template>

    <script src="/app.js" defer></script>
  </body>
</html>
