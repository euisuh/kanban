server {
    listen 443 ssl;
    http2 on;
    server_name kanban.uiseoya.com;

    ssl_certificate     /Users/uiseo/.config/kanban/certbot/config/live/kanban.uiseoya.com/fullchain.pem;
    ssl_certificate_key /Users/uiseo/.config/kanban/certbot/config/live/kanban.uiseoya.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    access_log /opt/homebrew/var/log/nginx/kanban.access.log;
    error_log  /opt/homebrew/var/log/nginx/kanban.error.log;

    client_max_body_size 12m;

    location / {
        proxy_pass             http://127.0.0.1:8097;
        proxy_http_version     1.1;
        proxy_set_header       Host              $host;
        proxy_set_header       X-Real-IP         $remote_addr;
        proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto $scheme;
        proxy_read_timeout     300s;
    }
}
