services:
  kanban:
    build: .
    container_name: kanban
    restart: unless-stopped
    ports:
      - "127.0.0.1:8097:8080"
    volumes:
      - ./data:/data
      - ./app/static/uploads:/app/app/static/uploads
    env_file:
      - .env
    environment:
      KANBAN_DATA_ROOT: /data
      KANBAN_DATA: /data/board.json
